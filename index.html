<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교육과정 시수 자동 맞춤</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="core.js"></script>
<script src="skeleton.js"></script>
<script src="blank.js"></script>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --line: #dfe2e7; --text: #1d1f24; --sub: #5f5f66;
    --blue: #2457d6; --blue-bg: #eaf0ff; --red: #c62828; --red-bg: #fdecec; --green: #1f7a3a; --green-bg: #e8f5ec;
    --amber-bg: #fff6dc; --gray-bg: #f0f1f4;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 450 15px/1.55 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; }
  header { background: var(--card); border-bottom: 1px solid var(--line); padding: 14px 24px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 18px; font-weight: 700; margin: 0 12px 0 0; }
  main { max-width: 1280px; margin: 0 auto; padding: 20px 24px 60px; }
  .btn { font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px; padding: 7px 14px; cursor: pointer; }
  .btn:hover { background: var(--gray-bg); }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.primary:hover { background: #1c47b3; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.small { padding: 3px 9px; font-size: 13px; }
  .muted { color: var(--sub); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
  .card h2 { font-size: 16px; font-weight: 700; margin: 0 0 12px; }
  .banner { padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; font-weight: 500; }
  .banner.info { background: var(--blue-bg); }
  .banner.ok { background: var(--green-bg); color: var(--green); }
  .banner.warn { background: var(--amber-bg); color: #7a5200; }
  .badge { display: inline-block; font-size: 12px; font-weight: 700; color: var(--blue); background: var(--blue-bg); border-radius: 5px; padding: 0 6px; margin-left: 6px; }
  .src { font-size: 13px; }
  .banner.err { background: var(--red-bg); color: var(--red); }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 14px; }
  .tabs button { font: inherit; font-weight: 600; border: 0; background: transparent; color: var(--sub); padding: 8px 14px; border-radius: 8px; cursor: pointer; }
  .tabs button.on { background: var(--card); color: var(--blue); box-shadow: 0 0 0 1px var(--line); }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { border: 1px solid var(--line); padding: 5px 7px; text-align: center; vertical-align: middle; }
  th { background: var(--gray-bg); font-weight: 600; }
  td.l, th.l { text-align: left; }
  .scroll { overflow-x: auto; }
  input[type=number], input[type=text], input[type=date] { font: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; background: #fff; color: var(--text); }
  input[type=number] { width: 64px; text-align: right; }
  input.name { width: 100%; min-width: 140px; }
  .changed { background: var(--amber-bg); font-weight: 700; }
  .changed s { color: var(--sub); font-weight: 450; margin-right: 4px; }
  /* 주별 시수: 원본 구성표 색 — 머리글 #E6EEF7, 월·주·일수 #F2F2F2, 휴업일 #F7E8E8+빨강, 단축 주 파랑 */
  /* 칸 너비 고정: 날짜 5칸·학년 6칸이 각각 같은 너비(긴 휴업일 이름이 칸을 넓히지 않게) */
  table.wk { table-layout: fixed; min-width: 1100px; }
  table.wk th { background: #E6EEF7; }
  table.wk td.gray { background: #F2F2F2; }
  table.wk td.hol { background: #F7E8E8; color: #D40000; font-weight: 700; }
  table.wk td.vac { background: #F2F2F2; color: var(--sub); }
  table.wk td.blank { background: #fafafa; }
  /* 행 높이 통일: 모든 주 행을 같은 높이로, 휴업일 이름은 한 줄(넘치면 …, 전체 이름은 마우스 올리면) */
  table.wk td { height: 38px; padding: 2px 4px; }
  table.wk td.notes { text-align: left; font-size: 12.5px; line-height: 1.4; padding: 4px 8px; }
  table.wk td.notes .red { color: #D40000; font-weight: 600; }
  table.wk td[data-tip] { cursor: help; }
  /* 즉시 뜨는 툴팁(브라우저 기본 title은 1초쯤 늦게 뜬다) */
  .tip { position: fixed; z-index: 50; display: none; max-width: 320px; padding: 6px 10px; border-radius: 6px; background: #1f2937; color: #fff; font-size: 13px; font-weight: 500; line-height: 1.45; white-space: pre-line; pointer-events: none; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  table.wk td.short { color: #0000FF; font-weight: 700; }
  table.wk tr.sumrow td { background: #F2F2F2; }
  .circ { display: inline-block; min-width: 24px; height: 24px; line-height: 21px; padding: 0 3px; border: 1.5px solid #1f2937; border-radius: 12px; font-weight: 700; }
  .legend { margin: 10px 0 0; font-size: 13px; color: var(--sub); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  .legend .sw { display: inline-block; min-width: 30px; padding: 2px 6px; margin-right: 4px; text-align: center; border: 1px solid var(--line); border-radius: 4px; background: #fff; color: var(--text); }
  .legend .sw.hol { background: #F7E8E8; color: #D40000; font-weight: 700; }
  .legend .sw.vac { background: #F2F2F2; color: var(--sub); }
  .legend .sw.short { color: #0000FF; font-weight: 700; }
  .legend .sw.changed { background: var(--amber-bg); }
  .legend .sw .circ { min-width: 20px; height: 20px; line-height: 17px; }
  .ev { box-shadow: inset 0 0 0 2px #9db4f0; }
  .bad { color: var(--red); font-weight: 700; }
  .good { color: var(--green); font-weight: 700; }
  .sumrow td { background: #fafbfc; font-weight: 700; }
  .grid-summary { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
  .gcard { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .gcard b { font-size: 20px; }
  .gcard.bad-card { border-color: #f0b4b4; background: var(--red-bg); }
  ul.checks { margin: 8px 0 0; padding-left: 20px; }
  ul.checks li { margin: 3px 0; }
  .gradebtns { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .gradebtns .btn.on { background: var(--blue); color: #fff; border-color: var(--blue); }
  .start { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .start > p { grid-column: 1 / -1; }
  .sel { font: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; background: #fff; color: var(--text); }
  th.other, td.other { background: #fafbfc; }
  .drop { border: 2px dashed var(--line); border-radius: 12px; padding: 40px; text-align: center; background: var(--card); }
  label.chk { display: inline-flex; align-items: center; gap: 2px; margin-right: 6px; white-space: nowrap; }
  @media (max-width: 800px) { .start { grid-template-columns: 1fr; } .grid-summary { grid-template-columns: repeat(3, minmax(0, 1fr)); } main { padding: 16px; } header { padding: 12px 16px; } }
</style>
</head>
<body>
<header>
  <h1 data-act="home" style="cursor:pointer">교육과정 시수 자동 맞춤</h1>
  <span id="fname" class="muted"></span>
  <span style="flex:1"></span>
  <button id="saveCfg" class="btn" disabled>설정 백업(JSON)</button>
  <label class="btn">설정 불러오기<input id="loadCfg" type="file" accept=".json" hidden></label>
  <button id="download" class="btn primary" disabled>한글 파일로 내려받기</button>
</header>
<input id="file" type="file" accept=".hwpx" hidden>
<main id="app"></main>
<script>
'use strict';
const $ = s => document.querySelector(s);
const WD = ['월', '화', '수', '목', '금'];
// mode: 'new' = 페이지에서 처음부터 구성해 새 한글 파일 생성 / 'file' = 기존 한글 파일에 채워 넣기
const S = { mode: null, zip: null, xml: '', name: '', year: null, doc: null, cfg: null, plan: null, vals: null, tab: 'summary', grade: 1, out: null, restored: false, error: '' };

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const md = s => { const d = Core.D(s); return `${d.getUTCMonth() + 1}.${d.getUTCDate()}.`; };
const yearOf = () => +S.cfg.semesters[0].from.slice(0, 4);
// 저장 이름: 새로 만들기 = 학년도, 파일 채우기 = 학년도 + 파일 이름('_시수반영'은 떼고) → 한 PC를 여러 학교가 써도 섞이지 않게
const baseName = () => S.name.replace(/\.hwpx$/i, '').replace(/(_시수반영)+$/, '');
const storeKey = () => (S.mode === 'new' ? `cu_form:new:${S.year}` : `cu_form:cfg:${yearOf()}:${baseName()}`);
function saveLocal() { try { localStorage.setItem(storeKey(), JSON.stringify(S.mode === 'new' ? { cfg: S.cfg, plan: S.plan } : S.cfg)); } catch (e) {} }
function loadLocal(key) { try { return JSON.parse(localStorage.getItem(key || storeKey()) || 'null'); } catch (e) { return null; } }
const clone = o => JSON.parse(JSON.stringify(o));

// ───────── 시작 화면 ─────────
function vStart() {
  const now = new Date(), y0 = now.getMonth() >= 8 ? now.getFullYear() + 1 : now.getFullYear();   // 9월부터는 다음 학년도를 기본으로
  const years = [y0 - 1, y0, y0 + 1, y0 + 2];
  return `<div class="start">
    <div class="card"><h2>새로 만들기</h2>
      <p class="muted" style="margin-top:0">학년도를 고르면 학기·방학·공휴일·요일별 시수·식 행사, 2022 개정 교육과정 기준 시수가 기본으로 채워집니다. 고친 뒤 새 한글 파일로 내려받습니다.</p>
      <p><select id="newYear" class="sel">${years.map(y => `<option value="${y}" ${y === y0 ? 'selected' : ''}>${y}학년도${loadLocal(`cu_form:new:${y}`) ? ' (저장된 구성 있음)' : ''}</option>`).join('')}</select>
      <button class="btn primary" data-act="new">시작</button></p>
      <p class="muted src" style="margin-bottom:0">공휴일·대체공휴일은 법령(관공서의 공휴일에 관한 규정 제2·3조)대로 계산해 채웁니다. 음력 공휴일은 2031학년도까지 들어 있습니다.</p></div>
    <div class="card"><h2>기존 한글 파일에 채워 넣기</h2>
      <p class="muted" style="margin-top:0">학교에서 쓰던 교육과정 구성표(.hwpx)를 열면 원본 서식은 그대로 두고 숫자만 계산해 바꿉니다. .hwp는 한글에서 «다른 이름으로 저장 → HWPX»로 바꾼 뒤 여세요.</p>
      <p style="margin-bottom:0"><label class="btn" for="file">한글 파일(.hwpx) 열기</label></p></div>
    <p class="muted src">파일과 입력한 내용은 이 브라우저 안에서만 처리되고 어떤 서버로도 보내지 않습니다.</p>
  </div>`;
}

function startNew(year, data) {
  Object.assign(S, { mode: 'new', year, name: '', zip: null, tab: 'summary', grade: 1, autoMsg: null });
  const saved = data || loadLocal(`cu_form:new:${year}`);
  S.restored = !!saved && !data;
  S.cfg = saved ? saved.cfg : Blank.defaultCfg(year);
  S.plan = saved ? saved.plan : Blank.defaultPlan();
  for (const h of S.cfg.holidays) h.name = h.name.replace('제헌절(확인 필요)', '제헌절');   // 예전 기본값 이름 정리
  $('#fname').textContent = `${year}학년도 새로 만들기`;
  $('#download').disabled = $('#saveCfg').disabled = false;
  render();
}

// ───────── 파일 열기 ─────────
$('#file').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const zip = await JSZip.loadAsync(f, { createFolders: false });
    const sec = zip.file('Contents/section0.xml');
    if (!sec) throw new Error('한글 문서(HWPX)의 본문을 찾지 못했습니다.');
    const xml = await sec.async('string');
    const doc = Core.readDoc(xml);
    Object.assign(S, { mode: 'file', zip, xml, name: f.name, doc, plan: null, tab: 'summary', grade: 1, autoMsg: null });
    S.cfg = { ...clone(doc.cfg), events: [] };
    const saved = loadLocal();
    S.restored = !!saved;
    if (saved) S.cfg = saved;
    S.vals = doc.gradeModels.map(Core.initialVals);
    $('#fname').textContent = f.name;
    $('#download').disabled = $('#saveCfg').disabled = false;
    render();
  } catch (err) {
    alert('파일을 읽지 못했습니다: ' + err.message);
    console.error(err);
  }
  e.target.value = '';
});

function resetData() {
  try { localStorage.removeItem(storeKey()); } catch (e) {}
  if (S.mode === 'new') { S.cfg = Blank.defaultCfg(S.year); S.plan = Blank.defaultPlan(); }
  else S.cfg = { ...clone(S.doc.cfg), events: [] };
  S.restored = false;
  render();
}

// ───────── 설정 백업/불러오기 ─────────
$('#saveCfg').addEventListener('click', () => {
  const data = S.mode === 'new' ? { cfg: S.cfg, plan: S.plan } : S.cfg;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  a.download = S.mode === 'new' ? `시수구성_${S.year}학년도.json` : `시수설정_${yearOf()}_${baseName()}.json`;
  a.click();
});
$('#loadCfg').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const c = JSON.parse(await f.text());
    if (c.plan && c.cfg) { startNew(+c.cfg.semesters[0].from.slice(0, 4), c); saveLocal(); }       // 새로 만들기 구성
    else if (c.semesters && c.base && c.events) {                                                  // 학사·행사 설정만
      if (!S.cfg) throw new Error('학사 설정만 담긴 파일입니다. 먼저 새로 만들기를 시작하거나 한글 파일을 여세요.');
      S.cfg = c; saveLocal(); render();
    } else throw new Error('시수 설정 파일이 아닙니다.');
  } catch (err) { alert('불러오지 못했습니다: ' + err.message); }
  e.target.value = '';
});

// ───────── 내려받기 ─────────
$('#download').addEventListener('click', async () => {
  const out = S.out;
  if (!out) return;
  if (S.mode === 'file' && !out.edits.length && !confirm('바뀌는 칸이 없습니다. 그래도 내려받을까요?')) return;
  const errs = out.checks.filter(c => c.level === 'error');
  if (errs.length && !confirm(`아직 맞지 않는 항목이 ${errs.length}개 있습니다.\n\n${errs.map(c => '· ' + c.msg).join('\n')}\n\n이대로 내려받을까요?`)) return;
  const nx = Core.applyEdits(S.xml, out.edits);
  let blob, name;
  if (S.mode === 'new') {
    blob = await Blank.packHwpx(nx);
    name = `${S.year}학년도_교육과정_시수표.hwpx`;
  } else {
    S.zip.file('Contents/section0.xml', nx, { createFolders: false });
    const mt = await S.zip.file('mimetype').async('string');
    S.zip.file('mimetype', mt, { compression: 'STORE', createFolders: false });              // 규약: mimetype은 무압축·첫 항목
    blob = await S.zip.generateAsync({ type: 'blob', compression: 'DEFLATE', mimeType: 'application/hwp+zip' });
    name = baseName() + '_시수반영.hwpx';
    // 내려받은 파일이 새 기준이 되도록 다시 읽는다
    S.xml = nx; S.doc = Core.readDoc(nx); S.vals = S.doc.gradeModels.map(Core.initialVals);
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  render();
});

// ───────── 입력 반영 ─────────
function rerender() {
  // 다시 그려도 입력 중이던 칸의 포커스를 잃지 않게
  setTimeout(() => {
    const id = document.activeElement && document.activeElement.dataset.id;
    render();
    if (id) { const el = document.querySelector(`[data-id="${id}"]`); if (el) el.focus(); }
  });
}
// 교과 표 칸 값 바꾸기: 파일 모드는 칸 값에, 새로 만들기는 구성(plan)에 적는다(문서를 매번 다시 조립하므로)
function setVal(gi, cell, v) {
  if (S.mode === 'file') { S.vals[gi].set(cell, v); return; }
  const m = S.doc.gradeModels[gi], P = S.plan.grades[gi + 1];
  for (const row of m.rows) for (const k of ['b1', 'v1', 'b2', 'v2']) {
    if (row.cells[k] !== cell || cell.r !== row.r) continue;
    const Y = +k[1] - 1;
    if (row.kind === 'cha' && k[0] === 'b') P.chaBase[Y] = v;
    else { const pr = P.rows.find(x => x.name === row.name); if (pr) { pr[k[0]] = pr[k[0]] || [null, null]; pr[k[0]][Y] = v; } }
    return;
  }
}
document.addEventListener('change', e => {
  const t = e.target, id = t.dataset.id;
  if (!id || !S.cfg) return;
  const [kind, a, b, c] = id.split(':');
  const v = t.type === 'number' ? (t.value === '' ? null : +t.value) : t.value;
  if (kind === 'sem') S.cfg.semesters[a][b] = v;
  else if (kind === 'hol' || kind === 'vac') { const L = kind === 'hol' ? S.cfg.holidays : S.cfg.vacations; L[a][b] = v; if (b === 'from' && (!L[a].to || L[a].to < v)) L[a].to = v; }
  else if (kind === 'base') S.cfg.base[a][b] = v ?? 0;
  else if (kind === 'ev') {
    const ev = S.cfg.events[a];
    if (b === 'grade') { const g = +c; ev.grades = t.checked ? [...new Set([...ev.grades, g])].sort() : ev.grades.filter(x => x !== g); }
    else { ev[b] = b === 'periods' ? (v ?? 0) : v; if (b === 'from' && (!ev.to || ev.to < v)) ev.to = v; }
  }
  else if (kind === 'val') setVal(+a, S.doc.gradeModels[a].table.cells[b], v);
  else return;
  if (kind !== 'val' || S.mode === 'new') saveLocal();
  rerender();
});
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const [act, a, b] = t.dataset.act.split(':');
  if (act === 'home') { if (S.mode && !confirm('처음 화면으로 갈까요? 입력한 학사·행사 설정은 이 브라우저에 저장돼 있습니다.')) return; Object.assign(S, { mode: null, doc: null, cfg: null, out: null }); $('#fname').textContent = ''; $('#download').disabled = $('#saveCfg').disabled = true; render(); return; }
  if (act === 'new') { startNew(+$('#newYear').value); return; }
  if (!S.cfg) return;
  const y = yearOf();
  if (act === 'tab') S.tab = a;
  else if (act === 'grade') S.grade = +a;
  else if (act === 'add-hol') S.cfg.holidays.push({ name: '재량휴업일', from: `${y}-05-04`, to: `${y}-05-04` });
  else if (act === 'add-vac') S.cfg.vacations.push({ name: '방학', from: `${y}-07-25`, to: `${y}-08-30` });
  else if (act === 'add-ev') S.cfg.events.push({ name: '행사', from: `${y}-03-03`, to: `${y}-03-03`, grades: [1, 2, 3, 4, 5, 6], periods: 4 });
  else if (act === 'del') S.cfg[a].splice(+b, 1);
  else if (act === 'sort-ev') S.cfg.events.sort((p, q) => p.from.localeCompare(q.from));
  else if (act === 'reset') { if (confirm(S.mode === 'new' ? '저장해 둔 구성을 지우고 기본값으로 새로 시작할까요?' : '저장해 둔 학사일정·행사 설정을 지우고 파일 내용으로 되돌릴까요?')) resetData(); return; }
  else if (act === 'auto') autoDistribute(+a);
  else if (act === 'add-auto') { if (!addAuto(+a)) return; }
  else if (act === 'del-auto') { const P = S.plan.grades[+a]; P.rows = P.rows.filter(x => !(x.auto && x.name === b)); }
  else return;
  if (act.startsWith('add') || act.startsWith('del') || act === 'sort-ev' || (S.mode === 'new' && act === 'auto')) saveLocal();
  render();
});

// ───────── 교과 표 화면용 모델 ─────────
function editableRows(gi) {
  const m = S.doc.gradeModels[gi], k = 'v' + m.cur, kb = 'b' + m.cur;
  const seen = new Set(), rows = [];
  for (const row of m.rows) {
    if (row.kind !== 'sub' && row.kind !== 'cha') continue;
    const cell = row.cells[k];
    if (!cell || seen.has(cell) || cell.r !== row.r) continue;
    seen.add(cell);
    const bc = row.cells[kb];
    rows.push({ row, cell, name: row.name, kind: row.kind, base: bc && bc.r === row.r ? (S.vals[gi].get(bc) || 0) : 0, value: S.vals[gi].get(cell) });
  }
  return rows;
}

function autoDistribute(gi) {
  const residual = S.out.gradeResults[gi].calTotal - S.out.gradeResults[gi].curTotal;
  const rows = editableRows(gi);
  const next = Core.distributeResidual(rows.map(({ name, kind, base, value }) => ({ name, kind, base, value })), residual);
  const moved = rows.map((r, i) => (next[i] !== r.value ? `${r.name} ${r.value}→${next[i]}` : null)).filter(Boolean);
  const done = next.reduce((a, v, i) => a + ((v || 0) - (rows[i].value || 0)), 0);
  rows.forEach((r, i) => setVal(gi, r.cell, next[i]));
  S.autoMsg = { gi, text: `자동 배분: ${moved.join(', ') || '바꿀 수 있는 과목 없음'}` +
    (done !== residual ? ` — ${Math.abs(residual - done)}시간은 ±20%·감축 불가 기준 때문에 옮기지 못했습니다. 직접 조정하세요.` : '') };
}

// 학교자율시간 과목 추가(새로 만들기 전용): 관련 교과(군) 아래에 기준 없는 교과 행으로 넣는다
function addAuto(gr) {
  const name = ($('#autoName').value || '').trim(), group = $('#autoGroup').value, hours = +$('#autoHours').value || 0, Y = +$('#autoYear').value;
  const P = S.plan.grades[gr];
  if (!name) { alert('과목 이름을 적어 주세요.'); return false; }
  if (P.rows.some(x => x.name === name)) { alert('같은 이름의 과목이 이미 있습니다.'); return false; }
  const v = [null, null]; v[Y] = hours;          // 운영하지 않는 해는 빈칸
  const rows = P.rows, lastInGroup = rows.map(x => x.group).lastIndexOf(group);
  rows.splice(lastInGroup + 1, 0, { name, kind: 'sub', group, auto: true, b: [null, null], v });
  return true;
}

// ───────── 그리기 ─────────
function render() {
  if (!S.mode) { $('#app').innerHTML = vStart(); return; }
  try {
    if (S.mode === 'new') {
      S.xml = Blank.buildSection(S.cfg, S.plan, S.year);      // 입력이 바뀔 때마다 문서를 다시 조립(주 수·과목 수가 바뀌어도 표가 따라감)
      S.doc = Core.readDoc(S.xml);
      S.vals = S.doc.gradeModels.map(Core.initialVals);
      saveLocal();
    }
    S.out = Core.buildEdits(S.doc, S.cfg, S.vals);
  } catch (err) {
    console.error(err);
    $('#app').innerHTML = `<div class="banner err">계산하지 못했습니다: ${esc(err.message)}</div><p>학사일정(학기·방학 날짜)을 확인하세요. <button class="btn small" data-act="reset">기본값으로 되돌리기</button></p>`;
    return;
  }
  const errs = S.out.checks.filter(c => c.level === 'error');
  $('#download').textContent = S.mode === 'new' ? '한글 파일 만들기' : `한글 파일로 내려받기 (${S.out.edits.length}칸 변경)`;
  const tabs = [['summary', '요약·검사'], ['cal', '학사일정'], ['events', '행사 시수 조정'], ['base', '요일별 기본 시수'], ['weeks', '주별 시수'], ['subjects', '교과·창체 시수']];
  if (S.mode === 'file') tabs.push(['changes', `바뀌는 칸 (${S.out.edits.length})`]);
  const restoredMsg = S.mode === 'new' ? `저장해 둔 ${S.year}학년도 구성을 이어서 열었습니다. <button class="btn small" data-act="reset">기본값으로 새로 시작</button>`
    : `이 컴퓨터에 저장해 둔 ${yearOf()}학년도 학사일정·행사 설정을 불러왔습니다. <button class="btn small" data-act="reset">파일 내용으로 되돌리기</button>`;
  $('#app').innerHTML = `
    ${S.restored ? `<div class="banner info">${restoredMsg}</div>` : ''}
    <div class="tabs">${tabs.map(([k, l]) => `<button data-act="tab:${k}" class="${S.tab === k ? 'on' : ''}">${l}</button>`).join('')}</div>
    ${({ summary: vSummary, cal: vCal, events: vEvents, base: vBase, weeks: vWeeks, subjects: vSubjects, changes: vChanges })[S.tab](errs)}`;
}

function vWeeks() {
  // 한글 구성표와 같은 모양: 날짜 칸엔 숫자만(휴업일 분홍·빨강, 행사일 동그라미), 내용은 «주요 교육활동» 열에
  // 파일 모드에서만 원본과 다른 값을 표시(새로 만들기는 원본이 없다)
  const old = S.mode === 'file' ? new Map(S.out.edits.map(e => [`${e.table}|${e.why}`, e.cell.text])) : new Map();
  const normal = [1, 2, 3, 4, 5, 6].map(g => S.cfg.base[g].reduce((a, b) => a + +b, 0));
  const isVac = s => S.cfg.vacations.some(v => s >= v.from && s <= v.to);
  return S.out.res.sems.map(sem => {
    const label = `${sem.name} 주간 시수`;
    const cellV = (why, val, cls = '', tip = '') => {
      const o = old.get(`${label}|${why}`), t = tip ? ` data-tip="${esc(tip)}"` : '';
      return o !== undefined ? `<td class="changed ${cls}" data-tip="파일 값 ${esc(o)} → ${val}"><s>${esc(o)}</s>${val}</td>` : `<td class="${cls}"${t}>${val}</td>`;
    };
    const rows = sem.weeks.map((w, i) => {
      let month = '';
      if (i === 0 || sem.weeks[i - 1].month !== w.month) {
        let span = 1;
        while (i + span < sem.weeks.length && sem.weeks[i + span].month === w.month) span++;
        month = `<td class="gray" rowspan="${span}">${w.month}월</td>`;
      }
      const days = w.off.map((why, k) => {
        const s = Core.iso(Core.addDays(Core.D(w.mon), k)), d = Core.D(s).getUTCDate();
        if (why === null && !w.dates.includes(s)) return '<td class="blank"></td>';
        if (why && isVac(s)) return `<td class="vac" data-tip="${md(s)} ${esc(why)}">${d}</td>`;
        if (why) return `<td class="hol" data-tip="${md(s)} ${esc(why)}">${d}</td>`;
        const evs = S.cfg.events.filter(e => s >= e.from && s <= (e.to || e.from));
        return evs.length
          ? `<td data-tip="${esc(evs.map(e => `${md(s)} ${e.name} · ${e.grades.join(',')}학년 ${e.periods}교시`).join('\n'))}"><span class="circ">${d}</span></td>`
          : `<td>${d}</td>`;
      }).join('');
      const notes = Blank.weekNotes(S.cfg, w).map(n => `<div class="${n.holiday ? 'red' : ''}">${esc(n.t)}</div>`).join('');
      const hours = w.hours.map((h, g) => cellV(`${i + 1}주 ${g + 1}학년`, h, h !== normal[g] ? 'short' : '', h !== normal[g] ? `${g + 1}학년: 평소 ${normal[g]}시간 → 이번 주 ${h}시간` : '')).join('');
      return `<tr>${month}<td class="gray">${i + 1}</td>${days}${cellV(`${i + 1}주`, w.dates.length, 'gray')}<td class="notes">${notes}</td>${hours}</tr>`;
    }).join('');
    const vac = S.cfg.vacations.filter(v => v.from > sem.weeks[0].mon && v.from <= sem.to).map(v => `${v.name} ${md(v.from)}~${md(v.to)}`).join(', ');
    return `<div class="card"><h2>${sem.name} <span class="muted" style="font-weight:500">${md(sem.from)} ~ ${md(sem.to)}</span></h2>
      <div class="scroll"><table class="wk">
        <colgroup><col style="width:4.5%"><col style="width:3.5%">${'<col style="width:5%">'.repeat(5)}<col style="width:4.5%"><col style="width:30%">${'<col>'.repeat(6)}</colgroup>
        <tr><th rowspan="2">월</th><th rowspan="2">주</th><th colspan="5">연간 수업 일수</th><th rowspan="2">수업<br>일수</th><th rowspan="2">주요 교육활동</th><th colspan="6">학년별 주당 수업 시수</th></tr>
        <tr>${WD.map(w => `<th>${w}</th>`).join('')}${[1, 2, 3, 4, 5, 6].map(g => `<th>${g}</th>`).join('')}</tr>
        ${rows}
        <tr class="sumrow"><td colspan="2">${sem.name} 소계</td>${sem.dow.map(n => `<td>${n}</td>`).join('')}<td>${sem.days}</td><td class="notes">${esc(vac)}</td>${sem.hours.map(h => `<td>${Core.fmt(h)}</td>`).join('')}</tr>
      </table></div>
      <p class="legend"><span class="sw hol">5</span>휴업일 <span class="sw vac">5</span>방학 <span class="sw"><span class="circ">5</span></span>행사일 <span class="sw short">23</span>평소와 시수가 다른 주${S.mode === 'file' ? ' <span class="sw changed">23</span>한글 파일과 달라지는 값(취소선이 원래 값)' : ''} · 날짜·시수 칸에 마우스를 올리면 내용이 바로 보입니다.</p></div>`;
  }).join('');
}

function vSubjects() {
  const gi = S.grade - 1, m = S.doc.gradeModels[gi], gr = S.out.gradeResults[gi];
  const vals = S.vals[gi], cur = m.cur, oth = 3 - cur;
  const d = gr.calTotal - gr.curTotal;
  const year = yearOf(), otherYear = year + (m.years[oth] - S.grade);
  const diffTxt = n => (n ? `<span class="${n > 0 ? 'good' : 'bad'}">${n > 0 ? '+' : ''}${n}</span>` : '');
  const sums = (kinds, key) => [...new Set(m.rows.filter(x => kinds.includes(x.kind)).map(x => x.cells[key]).filter(Boolean))].reduce((a, c) => a + (vals.get(c) || 0), 0);
  const autoNames = new Set([1, 2].flatMap(Y => Core.autonomousSubjects(m, vals, Y).map(x => x.name)));
  const planAuto = S.mode === 'new' ? S.plan.grades[S.grade].rows.filter(x => x.auto).map(x => x.name) : [];
  // 칸 입력: 병합된 칸은 첫 행에만 입력칸, 아래 행은 ↑
  const inp = (row, key, cls = '') => {
    const c = row.cells[key];
    if (!c) return '<td></td>';
    if (c.r !== row.r) return '<td class="muted">↑</td>';
    const v = vals.get(c);
    return `<td class="${cls}"><input type="number" min="0" data-id="val:${gi}:${m.table.cells.indexOf(c)}" value="${v ?? ''}"></td>`;
  };
  let body = '';
  for (const row of m.rows) {
    if (row.kind === 'sub' || row.kind === 'cha') {
      const c = row.cells['v' + cur], bc = row.cells['b' + cur];
      const top = c && c.r === row.r, base = bc && bc.r === row.r ? vals.get(bc) || 0 : 0;
      const isAuto = autoNames.has(row.name) || planAuto.includes(row.name);
      body += `<tr><td class="l">${row.kind === 'sub' ? '교과' : '창체'}</td>
        <td class="l">${esc(row.name)}${isAuto ? '<span class="badge">학교자율시간</span>' : ''}${planAuto.includes(row.name) ? ` <button class="btn small" data-act="del-auto:${S.grade}:${esc(row.name)}">삭제</button>` : ''}</td>
        ${inp(row, 'b' + cur)}${inp(row, 'v' + cur)}
        <td>${top && row.kind === 'sub' && vals.get(c) !== null ? diffTxt((vals.get(c) || 0) - base) : ''}</td>
        ${inp(row, 'b' + oth, 'other')}${inp(row, 'v' + oth, 'other')}</tr>`;
    } else {
      const kinds = row.kind === 'subSum' ? ['sub'] : row.kind === 'chaSum' ? ['cha'] : ['sub', 'cha'];
      const v = sums(kinds, 'v' + cur), b = sums(kinds, 'b' + cur);
      body += `<tr class="sumrow"><td class="l" colspan="2">${row.kind === 'subSum' ? '교과 소계' : row.kind === 'chaSum' ? '창체 소계' : '총 수업 시간 수'}</td>
        <td>${Core.fmt(b)}</td><td>${Core.fmt(v)}</td><td>${diffTxt(v - b)}</td><td>${Core.fmt(sums(kinds, 'b' + oth))}</td><td>${Core.fmt(sums(kinds, 'v' + oth))}</td></tr>`;
    }
  }
  const gradeChecks = S.out.checks.filter(c => c.msg.startsWith(`${S.grade}학년 표`));
  const band = Blank.BANDS[Blank.bandOf(S.grade)];
  const autoForm = S.mode !== 'new' ? '' : `<div class="card"><h2>학교자율시간 과목 추가</h2>
    <p class="muted" style="margin-top:0">관련 교과(군) 아래에 기준 시수 없는 과목으로 들어갑니다. 올해 기준 시수는 <b>${Core.fmt(gr.calTotal)}÷34 = ${Math.floor(gr.calTotal / 34)}시간</b>(또는 ${Math.floor(gr.calTotal / 34) + 1}시간)입니다. 넣은 뒤 «남은 시수 자동 배분»으로 다른 교과를 줄이세요.</p>
    <p style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:0">
      <input id="autoName" type="text" placeholder="과목 이름" style="min-width:200px">
      <select id="autoGroup" class="sel">${band.groups.map(g => `<option value="${esc(g.key)}">${esc(g.key)}</option>`).join('')}</select>
      <select id="autoYear" class="sel"><option value="${cur - 1}">${S.grade}학년(${year}년, 올해)</option><option value="${oth - 1}">${m.years[oth]}학년(${otherYear}년)</option></select>
      <input id="autoHours" type="number" min="0" value="${Math.floor(gr.calTotal / 34)}"> 시간
      <button class="btn" data-act="add-auto:${S.grade}">추가</button></p></div>`;
  return `<div class="gradebtns">${[1, 2, 3, 4, 5, 6].map(g => `<button class="btn ${g === S.grade ? 'on' : ''}" data-act="grade:${g}">${g}학년</button>`).join('')}</div>
    <div class="card"><h2>${S.grade}학년 ${year}학년도 교과·창체 시수</h2>
    ${d ? `<div class="banner err">달력으로 계산한 연간 시수는 <b>${Core.fmt(gr.calTotal)}시간</b>인데 표 합계는 <b>${Core.fmt(gr.curTotal)}시간</b>입니다. <b>${d > 0 ? d + '시간을 더 배분해야' : -d + '시간을 줄여야'}</b> 합니다.
      <button class="btn small" data-act="auto:${gi}">남은 시수 자동 배분</button></div>`
      : `<div class="banner ok">달력 시수 ${Core.fmt(gr.calTotal)}시간과 표 합계가 같습니다.</div>`}
    ${S.autoMsg && S.autoMsg.gi === gi ? `<div class="banner info">${esc(S.autoMsg.text)}</div>` : ''}
    ${gradeChecks.map(c => `<div class="banner ${c.level === 'warn' ? 'warn' : 'err'}">${esc(c.msg)}</div>`).join('')}
    <div class="scroll"><table>
      <tr><th class="l" rowspan="2">구분</th><th class="l" rowspan="2">과목·활동</th><th colspan="3">${S.grade}학년 · ${year}년 (올해)</th><th colspan="2" class="other">${m.years[oth]}학년 · ${otherYear}년 (${oth < cur ? '지난해 이수' : '내년 계획'})</th></tr>
      <tr><th>본교기준</th><th>본교시수</th><th>증감</th><th class="other">본교기준</th><th class="other">본교시수</th></tr>
      ${body}
    </table></div>
    <p class="muted" style="margin:8px 0 0">증감, 소계, 두 해 합계, 표 «연간 요약», «창체 시간 배당»은 입력값에서 자동으로 계산됩니다. 창체 증감은 첫 활동(자율) 칸에 붙습니다.</p>
    <p class="muted" style="margin:4px 0 0">«남은 시수 자동 배분»은 기준 대비 여유 비율이 가장 큰 교과부터 1시간씩 옮깁니다. 한 해 기준의 ±20% 안에서만 움직이고, 체육·음악·미술·즐거운 생활은 기준 밑으로 줄이지 않으며, 학교자율시간 과목과 창체는 건드리지 않습니다.</p></div>
    ${autoForm}`;
}


function vAutonomy() {
  const rows = [];
  S.out.gradeResults.forEach((g, i) => {
    for (const a of g.autoInfo || []) {
      if (!a.cur && !a.list.length) continue;
      const need = a.gy >= 3 ? `${Core.fmt(a.T)}÷34 = ${(a.T / 34).toFixed(2)} → <b>${a.need}~${a.need + 1}시간</b>` : '자율 운영';
      const ok = !a.list.length ? '<span class="muted">편성 없음</span>' : a.sum >= a.need && a.list.every(x => x.hours >= 17) && a.list.length <= 2 ? '<span class="good">기준 충족</span>' : '<span class="bad">확인 필요</span>';
      rows.push(`<tr><td>${i + 1}학년 표</td><td>${a.gy}학년 ${a.yy}년<span class="muted"> (${a.rel})</span></td><td class="l">${a.list.map(x => `${esc(x.name)} ${x.hours}시간`).join(', ') || '-'}</td><td>${need}</td><td>${ok}</td></tr>`);
    }
  });
  return `<div class="card"><h2>학교자율시간</h2>
    <div class="scroll"><table><tr><th>표</th><th>학년·연도</th><th class="l">편성 과목·시수</th><th>기준 시수 (총 시수 ÷ 34)</th><th>판정</th></tr>${rows.join('')}</table></div>
    <ul class="checks muted src">
      <li>3~4·5~6학년군은 두 해 중 <b>한 학기 이상 필수</b>, 1~2학년군은 자율 운영입니다. 과목은 <b>17차시 이상</b>, 한 학년 한 학기 <b>2개 이내</b>로 운영합니다.</li>
      <li>국가 교과가 아니면서 본교기준이 비어 있는 교과 행을 학교자율시간 과목으로 인식합니다.</li>
      <li>이 도구가 확인하지 <b>못하는</b> 것: 한 학기 안에 몰아 편성했는지(두 학기 분산 불가), 성취기준 개발·재구조화, 평가 계획 포함, 승인 절차.</li>
      <li>근거: 경상남도교육청 「2026학년도 경상남도 초등학교 교육과정 설계·운영 도움자료」, 「2025. 초등학교 학교자율시간 도움자료」(경남교육 2025-114)</li>
    </ul></div>`;
}

function vChanges() {
  if (!S.out.edits.length) return '<div class="card"><div class="banner ok">한글 파일과 달라지는 칸이 없습니다.</div></div>';
  const groups = {};
  for (const e of S.out.edits) (groups[e.table] = groups[e.table] || []).push(e);
  return Object.entries(groups).map(([t, L]) => `<div class="card"><h2>${esc(t)} <span class="muted" style="font-weight:500">${L.length}칸</span></h2>
    <table style="max-width:760px"><tr><th class="l">위치</th><th>지금</th><th>바뀔 값</th></tr>
    ${L.map(e => `<tr><td class="l">${esc(e.why || `${e.cell.r + 1}행 ${e.cell.c + 1}열`)}</td><td class="muted">${esc(e.cell.text.split('\n')[0])}</td><td class="changed">${esc(e.text)}</td></tr>`).join('')}
    </table></div>`).join('');
}

// ───────── 즉시 툴팁: data-tip 달린 칸에 마우스를 올리면 바로 띄운다 ─────────
const tipEl = document.createElement('div');
tipEl.className = 'tip';
document.body.appendChild(tipEl);
document.addEventListener('mouseover', e => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (!t) { tipEl.style.display = 'none'; return; }
  tipEl.textContent = t.dataset.tip;
  tipEl.style.display = 'block';
  const r = t.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  const left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width / 2 - w / 2));
  const top = r.bottom + h + 10 > window.innerHeight ? r.top - h - 6 : r.bottom + 6;   // 아래 공간이 없으면 위로
  tipEl.style.left = left + 'px'; tipEl.style.top = top + 'px';
});
window.addEventListener('scroll', () => { tipEl.style.display = 'none'; }, true);

render();
</script>
</body>
</html>
